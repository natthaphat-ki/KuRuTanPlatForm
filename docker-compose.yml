services:
  db:
    image: pgvector/pgvector:pg16
    container_name: kurutan-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kurutan}
      POSTGRES_USER: ${POSTGRES_USER:-kurutan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kurutan}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - kurutan_pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kurutan} -d ${POSTGRES_DB:-kurutan}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./services/api
    container_name: kurutan-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://kurutan:kurutan@db:5432/kurutan}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./services/api:/app
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  kurutan_pgdata:
